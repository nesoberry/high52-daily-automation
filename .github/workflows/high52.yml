name: 신고가 종목 일일 수집

on:
  schedule:
    # 평일(월~금) 한국시간 오후 4시 30분 (= UTC 07:30). GitHub 무료 cron은 수십 분~수 시간 늦을 수 있음.
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치 (Playwright)
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 수집 실행
        env:
          STOCKEASY_SESSION: ${{ secrets.STOCKEASY_SESSION }}
          APPSCRIPT_WEBAPP_URL: ${{ secrets.APPSCRIPT_WEBAPP_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
        run: node extract.js
